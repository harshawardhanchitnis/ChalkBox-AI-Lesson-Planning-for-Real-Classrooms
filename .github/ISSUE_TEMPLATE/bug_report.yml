name: Bug report
description: Report a reproducible problem in ChalkBox
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include API keys, private teacher documents, learner PII, or other secrets.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: Describe the problem clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable reproduction you can.
      placeholder: |
        1. Go to ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/OS, deployment type, commit or version, and whether optional integrations are enabled.
      placeholder: "Chrome 140 / Windows 11 / local / commit ..."
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Add sanitized evidence if useful. Remove secrets and private data first.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I have removed secrets, credentials, private textbook content, and learner/user PII from this report.
          required: true
        - label: This is not a security vulnerability requiring private disclosure under SECURITY.md.
          required: true
